<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">How an aura works</title><desc id="desc">A data source feeds a trigger. Aura state connects to action lists and overlay visibility.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f4c957"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#f1f5fc}.title{font-size:32px;font-weight:650}.label{font-size:28px;font-weight:600}.copy{font-size:24px}.muted{fill:#bdcde3}.gold{fill:#f4c957}.card{fill:#102344;stroke:#34547e;stroke-width:2}.flow{fill:none;stroke:#f4c957;stroke-width:3;marker-end:url(#arrow)}</style><rect x="1" y="1" width="1198" height="618" rx="22" fill="#091427" stroke="#34547e" stroke-width="2"/><text x="40" y="60" class="title" text-anchor="start">From data source to reaction</text><rect x="40" y="215" width="250" height="190" rx="16" class="card"/><rect x="350" y="255" width="190" height="110" rx="16" class="card"/><rect x="600" y="215" width="220" height="190" rx="16" class="card"/><rect x="900" y="110" width="260" height="260" rx="16" class="card"/><rect x="900" y="430" width="260" height="110" rx="16" class="card"/><text x="165" y="260" class="label" text-anchor="middle">Source</text><text x="165" y="310" class="copy" text-anchor="middle">Window · screen</text><text x="165" y="352" class="copy" text-anchor="middle">File · key</text><text x="445" y="320" class="label" text-anchor="middle">Trigger</text><text x="710" y="260" class="label" text-anchor="middle">State</text><text x="710" y="310" class="copy" text-anchor="middle">Active</text><text x="710" y="350" class="copy" text-anchor="middle">Not Active</text><text x="710" y="387" class="copy muted" text-anchor="middle">Unknown</text><text x="1030" y="154" class="label" text-anchor="middle">Actions</text><text x="1030" y="213" class="copy" text-anchor="middle">On Enter</text><text x="1030" y="272" class="copy" text-anchor="middle">While Active</text><text x="1030" y="331" class="copy" text-anchor="middle">On Exit</text><text x="1030" y="495" class="label" text-anchor="middle">Overlay</text><path d="M295 310 H342" class="flow"/><path d="M545 310 H592" class="flow"/><path d="M825 310 H860 V240 H892" class="flow"/><path d="M860 310 V485 H892" class="flow"/><text x="40" y="580" class="copy muted" text-anchor="start">Configure the source, actions and visibility separately</text></svg>