<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Three EyeAuras tools</title><desc id="desc">A macro runs ordered steps. An aura reacts to a condition. A behavior tree selects a branch on ticks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f4c957"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#f1f5fc}.title{font-size:32px;font-weight:650}.label{font-size:28px;font-weight:600}.copy{font-size:24px}.muted{fill:#bdcde3}.gold{fill:#f4c957}.card{fill:#102344;stroke:#34547e;stroke-width:2}.flow{fill:none;stroke:#f4c957;stroke-width:3;marker-end:url(#arrow)}</style><rect x="1" y="1" width="1198" height="518" rx="22" fill="#091427" stroke="#34547e" stroke-width="2"/><text x="40" y="60" class="title" text-anchor="start">Choose how to organize your logic</text><rect x="40" y="100" width="340" height="320" rx="16" class="card"/><path d="M60 101 H360" stroke="#f4c957" stroke-width="4"/><rect x="430" y="100" width="340" height="320" rx="16" class="card"/><path d="M450 101 H750" stroke="#f4c957" stroke-width="4"/><rect x="820" y="100" width="340" height="320" rx="16" class="card"/><path d="M840 101 H1140" stroke="#f4c957" stroke-width="4"/><text x="65" y="152" class="label" text-anchor="start">Macro</text><text x="65" y="196" class="copy" text-anchor="start">Steps in order</text><text x="65" y="232" class="copy muted" text-anchor="start">with waits</text><text x="65" y="276" class="copy gold" text-anchor="start">Open by default</text><rect x="70" y="320" width="70" height="58" rx="9" fill="#203d66"/><text x="105" y="359" class="label" text-anchor="middle">1</text><path d="M145 349 H164" class="flow"/><rect x="170" y="320" width="70" height="58" rx="9" fill="#203d66"/><text x="205" y="359" class="label" text-anchor="middle">2</text><path d="M245 349 H264" class="flow"/><rect x="270" y="320" width="70" height="58" rx="9" fill="#203d66"/><text x="305" y="359" class="label" text-anchor="middle">3</text><text x="455" y="152" class="label" text-anchor="start">Aura</text><text x="455" y="196" class="copy" text-anchor="start">Watch a condition</text><text x="455" y="232" class="copy muted" text-anchor="start">and react</text><rect x="450" y="320" width="140" height="58" rx="9" fill="#203d66"/><rect x="620" y="320" width="130" height="58" rx="9" fill="#203d66"/><path d="M595 349 H615" class="flow"/><text x="520" y="356" class="copy" text-anchor="middle">Condition</text><text x="685" y="356" class="copy" text-anchor="middle">Reaction</text><text x="845" y="152" class="label" text-anchor="start">Behavior tree</text><text x="845" y="196" class="copy" text-anchor="start">Choose a branch</text><text x="845" y="232" class="copy muted" text-anchor="start">on ticks</text><circle cx="990" cy="295" r="26" fill="#203d66"/><text x="990" y="305" class="label" text-anchor="middle">?</text><path d="M990 323 V335 H905 V355" class="flow"/><path d="M990 335 H1075 V355" class="flow"/><rect x="866" y="360" width="78" height="42" rx="8" fill="#203d66"/><rect x="1036" y="360" width="78" height="42" rx="8" fill="#203d66"/><text x="905" y="389" class="copy" text-anchor="middle">A</text><text x="1075" y="389" class="copy" text-anchor="middle">B</text><text x="40" y="478" class="copy muted" text-anchor="start">C# — the next level for custom logic and interfaces</text></svg>