<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#243148" stroke-width="0.6"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#70c8ff"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#76e4ae"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#ffacb5"/></marker></defs><rect width="1000" height="620" rx="20" fill="#101827"/><rect x="14" y="14" width="972" height="592" rx="16" fill="url(#grid)" stroke="#52647c"/><g font-family="DejaVu Sans Mono,monospace">
<text x="500.0" y="48" fill="#edf4ff" font-size="24" text-anchor="middle">Sequence: successful checks admit the next step</text>
<text x="500" y="83" fill="#bacce3" font-size="18" text-anchor="middle">Example branches below: A succeeded; B is the current child.</text>
<rect x="65" y="125" width="240" height="90" rx="12" fill="#172338" stroke="#70c8ff" stroke-width="2"/>
<text x="185" y="161" fill="#edf4ff" font-size="23" text-anchor="middle">A · Check 1</text>
<text x="185" y="193" fill="#bacce3" font-size="17" text-anchor="middle">your condition</text>
<rect x="380" y="125" width="240" height="90" rx="12" fill="#172338" stroke="#70c8ff" stroke-width="2"/>
<text x="500" y="161" fill="#edf4ff" font-size="23" text-anchor="middle">B · Check 2</text>
<text x="500" y="193" fill="#bacce3" font-size="17" text-anchor="middle">your condition</text>
<rect x="695" y="125" width="240" height="90" rx="12" fill="#172338" stroke="#70c8ff" stroke-width="2"/>
<text x="815" y="161" fill="#edf4ff" font-size="23" text-anchor="middle">C · Reaction</text>
<text x="815" y="193" fill="#bacce3" font-size="17" text-anchor="middle">your own work</text>
<path d="M317 170H366" stroke="#76e4ae" stroke-width="2.5" fill="none" marker-end="url(#green)"/>
<text x="341" y="150" fill="#76e4ae" font-size="15" text-anchor="middle">Success</text>
<path d="M632 170H681" stroke="#76e4ae" stroke-width="2.5" fill="none" marker-end="url(#green)"/>
<text x="656" y="150" fill="#76e4ae" font-size="15" text-anchor="middle">Success</text>
<path d="M470 227V269H275V318" stroke="#ffacb5" stroke-width="2.5" fill="none" marker-end="url(#red)"/>
<text x="324" y="256" fill="#ffacb5" font-size="19" text-anchor="start">Failure</text>
<path d="M530 227V287H720V318" stroke="#70c8ff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="611" y="274" fill="#70c8ff" font-size="19" text-anchor="start">Running</text>
<rect x="65" y="330" width="410" height="108" rx="12" fill="#172338" stroke="#ffacb5" stroke-width="2"/>
<text x="270" y="370" fill="#ffacb5" font-size="21" text-anchor="middle">Sequence returns Failure</text>
<text x="270" y="410" fill="#edf4ff" font-size="20" text-anchor="middle">Do not call C.</text>
<rect x="525" y="330" width="410" height="108" rx="12" fill="#172338" stroke="#70c8ff" stroke-width="2"/>
<text x="730" y="370" fill="#70c8ff" font-size="21" text-anchor="middle">Sequence returns Running</text>
<text x="730" y="410" fill="#edf4ff" font-size="20" text-anchor="middle">Next tick: resume B.</text>
<path d="M947 385H970V245H610V227" stroke="#70c8ff" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="500" y="490" fill="#bacce3" font-size="20" text-anchor="middle">Running keeps the current step; earlier successful</text>
<text x="500" y="522" fill="#bacce3" font-size="20" text-anchor="middle">checks are not repeated during this continuation.</text>
<text x="500" y="575" fill="#ffe0a3" font-size="18" text-anchor="middle">The diagram shows control flow, not game data or an editor UI.</text>
</g></svg>
